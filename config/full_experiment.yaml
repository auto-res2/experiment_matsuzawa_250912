experiment:
  name: full_run
  seeds: [13, 17, 23]
  datasets: [cifar100_split10]
  budgets:
    - {mem_mb: 0.25, flop_g: 0.5}
    - {mem_mb: 0.5,  flop_g: 1.0}
    - {mem_mb: 1.0,  flop_g: 1.0}
  epochs_per_task: 3
  batch: 32
  save_dir: .research/iteration4/full
