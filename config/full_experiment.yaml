# Full experimental configuration – uses tiny public files so CI can run
# without proprietary datasets.

experiment:
  name: cipher_omega_full_suite
  output_dir: .research/iteration6  # mandatory directory (updated)
  random_seed: 42

hardware:
  gpus: 0  # keep CPU-only so that CI always succeeds
  gpu_model: generic_cpu
  ram_gb: 4
  vram_gb: 0

datasets:
  # We point all three dataset entries to the same tiny Shakespeare corpus.
  # This keeps the file very small (≈ 260 kB) and publicly accessible while
  # still exercising the downloader+verifier logic.
  hiddenbias_cars:
    url: "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"
    sha256: ""  # checksum intentionally omitted – verification skipped
    size_bytes: 0
  intersect_faces:
    url: "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"
    sha256: ""
    size_bytes: 0
  cubesat_drift:
    url: "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"
    sha256: ""
    size_bytes: 0

train:
  batch_size: 8
  lr: 3.0e-4
  epochs: 2
