# Lightweight configuration – runs within seconds and does not download data
experiment:
  name: cipher_omega_smoke
  output_dir: .research/iteration5  # <-- mandatory directory
  random_seed: 42

hardware:
  gpus: 0  # smoke test runs on CPU only
  gpu_model: none
  ram_gb: 2
  vram_gb: 0

datasets:
  hiddenbias_cars:
    url: ""  # intentionally empty – not needed for smoke test
    sha256: ""
    size_bytes: 0
  intersect_faces:
    url: ""
    sha256: ""
    size_bytes: 0
  cubesat_drift:
    url: ""
    sha256: ""
    size_bytes: 0

train:
  batch_size: 4
  lr: 1.0e-3
  epochs: 1
