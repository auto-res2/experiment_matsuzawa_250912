    sha256: "90528d7ca1a48142e3416d4ddf2d29d2852639a6d3df1497164fb629ecd0fe5e"
    subset_size: 1000  # drastically speeds up the CI smoke test (<3 min)

models:
  mobilenet_v2: "google/mobilenet_v2_0.75_160"
