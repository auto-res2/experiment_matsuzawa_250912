# --------------------------------------------------------------
#  SMOKE CONFIG  –  runs <1 min per seed on a single GPU.
# --------------------------------------------------------------
experiment:
  name: smoke_test
  seeds: [13]
  datasets: [fake_small]
  budgets:
    mem_mb: 512        # generous to avoid accidental OOM in CI
    flop_g: 10         # generous – small synthetic dataset anyway
  epochs_per_task: 1
  batch: 8
  max_tasks: 2           # only first 2 tasks for speed
  save_dir: .research/iteration6/smoke
