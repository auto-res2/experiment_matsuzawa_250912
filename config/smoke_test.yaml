# Small-scale quick-validation config
# Reduces sample counts & epochs to keep runtime <2-3 min on CI.

datasets:
  coco2017:
    urls:
      images: "http://images.cocodataset.org/zips/val2017.zip"
      captions: "http://images.cocodataset.org/annotations/annotations_trainval2017.zip"
    split_caption_sample: 5  # <<-- drastically reduced
    img_resolution: 256
    enabled: true
  wmt22_en_zh:
    enabled: false  # skipped in smoke-test to avoid large / missing download
  habitat_lite:
    enabled: false  # skip heavy clone during CI

models:
  sd_lite:
    hf_repo: "stabilityai/stable-diffusion-2-1"
    torch_dtype: "float16"
  t5_base:
    hf_repo: "google-t5/t5-base"
    torch_dtype: "bfloat16"

hyperparameters:
  mpc_horizon: 4
  mpc_rollouts: 4
  carbon_weight: 0.1
  thermal_weight: 0.05
  uvec_delta: 1e-3

hardware_devices: ["A100"]
