[project]
name = "safe_fuse_psi"
version = "0.1.0"
description = "Reference implementation of SAFE-FUSE-Ψ experiments"
authors = [{ name = "Researcher", email = "research@example.com" }]
requires-python = ">=3.9"
dependencies = [
  "torch>=1.13.0",
  "torch-geometric>=2.3.0",
  "opacus>=1.2.0",
  "scikit-learn>=1.1.0",
  "tqdm>=4.64.0",
  "seaborn>=0.12.0",
  "matplotlib>=3.5.0",
  "pyyaml>=6.0",
  "datasets>=2.12.0",
  "requests>=2.28.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.pdf"]
