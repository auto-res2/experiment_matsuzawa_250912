dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31.0",
  "torch>=1.9.0",
  "numpy>=1.23"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"" = ["*.yaml"]
