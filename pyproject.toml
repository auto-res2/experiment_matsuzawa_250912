[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos_diff_experiments"
version = "0.1.0"
description = "Reproducibility package for COSMOS-Diff experiments"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "OpenAI Assistant", email = "noreply@example.com"}
]
dependencies = [
  "torch>=2.0,<3.0",
  "matplotlib>=3.0",
  "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
