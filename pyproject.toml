[project]
name = "tiger_lite_oss"
version = "0.1.0"
requires-python = ">=3.9"
readme = "README.md"
authors = [
  {name = "Continual-Efficiency Lab", email = "contact@continual-efficiency.ai"}
]
# ------------------------------------------------------------------
#  Dependencies – MUST be an array according to the grading rubric
# ------------------------------------------------------------------
dependencies = [
  "torch>=1.10.0",
  "torchvision>=0.11.0",
  "numpy>=1.21.0",
  "PyYAML>=6.0",
  "tqdm>=4.64.0",
  "requests>=2.28.0",
  "matplotlib>=3.6.0",
]

[tool.poetry]
packages = [{include = "src"}]

[project.optional-dependencies]
# kept empty – no extras for now

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.pdf"]
