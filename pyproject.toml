[project]
name = "quadron_experiment"
version = "0.1.0"
description = "Refactored QuADRoN-DM experimental framework"

# Explicit dependency list – ordering matters only for readability but avoids
# unwanted implicit upgrades.
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "datasets>=2.16.0",
    "transformers>=4.35.0",
    "diffusers>=0.24.0",
    "pynvml>=11.4.1",
    "sacrebleu>=2.3.0",
    "pyyaml>=6.0",
    "sentencepiece>=0.1.99",  # required for many HF tokenizers (e.g. opus-mt)
]
