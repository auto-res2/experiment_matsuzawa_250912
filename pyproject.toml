[project]
name = "refactored-experiment"
version = "0.1.0"
description = "Refactored multi-file version of the original single-script experiment."
authors = [
  { name = "ML Researcher", email = "researcher@example.com" }
]
requires-python = ">=3.9"

# Correctly specify runtime dependencies as an ARRAY, not a mapping.
dependencies = [
  "pyyaml>=6.0",
  "torch>=1.9.0",
  "numpy>=1.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
